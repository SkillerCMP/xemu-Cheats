name: Release (Tag Pushed)

# Fork policy: tagged releases are manual only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository_owner == 'xemu-project'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ inputs.tag }}
      tag: ${{ inputs.tag }}
